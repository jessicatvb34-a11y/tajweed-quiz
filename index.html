<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tajweed Quiz</title>
<style>
:root{--bg:#fdfbf7;--surface:#fffdf9;--ink:#2b2b2b;--muted:#766f64;--line:#e3dccb;--gold:#bfa16a;--gold2:#a88a55;--danger:#a44b45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{min-height:100vh;background:var(--bg)}.wrap{max-width:760px;margin:auto;padding:28px 18px 40px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(43,43,43,.05)}h1{font-size:28px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 26px}.field{margin:18px 0}.label{font-weight:650;display:block;margin-bottom:8px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:16px}.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lang{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;font-size:16px}.lang.active{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(191,161,106,.18)}button{border:0;border-radius:11px;padding:13px 18px;background:var(--gold);color:#fff;font-weight:700;font-size:16px;cursor:pointer}.btnrow{display:flex;gap:10px;justify-content:space-between;margin-top:20px}.secondary{background:#eee9df;color:var(--ink)}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.timer{font-variant-numeric:tabular-nums;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:#fff}.timer.warn{color:var(--danger);border-color:#d9aaa6}.progress{height:7px;background:#eee9df;border-radius:99px;overflow:hidden;margin:8px 0 22px}.bar{height:100%;width:0;background:var(--gold);transition:width .2s}.qnum{font-size:13px;color:var(--muted);margin-bottom:8px}.qtext{font-size:19px;line-height:1.55;margin-bottom:18px}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.option.selected{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(191,161,106,.15)}.letter{font-weight:800;min-width:22px}.rtl .qtext,.rtl .optiontext{direction:rtl;text-align:right}.rtl .option{direction:ltr}.result{text-align:center}.score{font-size:48px;font-weight:850;margin:12px 0}.note{color:var(--muted)}@media(max-width:520px){.wrap{padding:18px 12px 30px}.card{padding:18px}h1{font-size:24px}.qtext{font-size:18px}.btnrow button{flex:1}}
</style></head><body><main class="app"><div class="wrap">
<section id="start" class="card"><h1 id="title">Tajweed Quiz</h1><p id="intro" class="sub">30 questions · 15 minutes</p><div class="field"><span class="label" id="nameLabel">Student name</span><input id="name" autocomplete="name" placeholder="Enter your name"></div><div class="field"><span class="label" id="langLabel">Language</span><div class="langs"><button type="button" class="lang active" data-lang="en">English</button><button type="button" class="lang" data-lang="ur">اردو</button></div></div><button id="startBtn" type="button">Start test</button></section>
<section id="quiz" class="card hidden"><div class="top"><strong id="progressText"></strong><span id="timer" class="timer">15:00</span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="questionArea"></div><div class="btnrow"><button id="prev" class="secondary" type="button">Previous</button><button id="next" type="button">Next</button></div></section>
<section id="result" class="card hidden result"><h1 id="resultTitle">Test submitted</h1><div id="score" class="score"></div><p id="resultMsg" class="note"></p></section>
</div></main>
<script>
const questions=[

["The tongue has 10 Makharij and 18 letters according to the lesson.",["True","False"],0],
["Lahn-e-Jali is clear/obvious, while Lahn-e-Khafi is hidden/minor.",["True","False"],0]
];
const ur=[
"تجوید کا لغوی معنی کیا ہے؟","تجوید کا اصطلاحی معنی کیا ہے؟","تجوید کا موضوع کیا ہے؟","قرآن کو تجوید کے مطابق پڑھنا کیا ہے؟","تجوید کے کتنے ارکان بیان کیے گئے ہیں؟","درج ذیل میں سے کون سا تجوید کے چار ارکان میں شامل نہیں؟","لحن کا لغوی معنی کیا ہے؟","لحنِ جلی کیا ہے؟","درج ذیل میں سے لحنِ جلی کی مثال کون سی ہے؟","أَنْعَمْتَ کو أَنْعَمْتُ پڑھنے سے کیا تبدیل ہوتا ہے؟","لحنِ خفی کے بارے میں درست بیان کون سا ہے؟","سبق کے مطابق لحنِ خفی کا حکم کیا ہے؟","کون سی مثال قراءت میں ایک حرف کے اضافے کو ظاہر کرتی ہے؟","فرضِ کفایہ اور فرضِ عین میں درست فرق کیا ہے؟","مخرج کیا ہے؟","سبق میں بیان کردہ حروف کے مخصوص مخارج کی معیاری تعداد کتنی ہے؟","حلق کے کتنے مخارج اور حروف ہیں؟","وسطِ حلق سے کون سے حروف ادا ہوتے ہیں؟","ادنیٰ حلق سے کون سے حروف ادا ہوتے ہیں؟","اقصیٰ حلق سے کون سے حروف ادا ہوتے ہیں؟","شفتین کے کتنے مخارج اور حروف ہیں؟","ف کو کیسے ادا کیا جاتا ہے؟","ب اور م میں کیا مشترک ہے؟","غیر مدّی واؤ کو کیسے ادا کیا جاتا ہے؟","ق اور ک کو مجموعی طور پر کیا کہا جاتا ہے؟","سبق کے مطابق ان میں سے کون سا حرف بھاری ہے؟","حروفِ شجریہ کون سے ہیں؟","یاء کے بارے میں درست بیان کون سا ہے؟","سبق کے مطابق زبان کے 10 مخارج اور 18 حروف ہیں۔","لحنِ جلی واضح ہے جبکہ لحنِ خفی پوشیدہ/معمولی ہے۔"];
const optionUR=[["خوبصورت بنانا / عمدہ بنانا / اچھا بنانا","حفظ کرنا","ترجمہ کرنا","لکھنا"],["جلدی پڑھنا","تمام عربی حروف حفظ کرنا","قرآنی حروف کو ان کے صحیح مخارج اور لازمی صفات کے ساتھ ادا کرنا","عربی گرامر سیکھنا"],["29 حروفِ ہجائیہ","صرف حروفِ مد","عربی گرامر","قرآن کا ترجمہ"],["فرضِ کفایہ","صرف سنت","فرضِ عین","مستحب"],["2","3","4","5"],["مخارج کی پہچان","صفات کی پہچان","پورا قرآن حفظ کرنا","زبان کو صحیح تلفظ کی تربیت دینا"],["خوبصورتی","غلطی / خطا","آواز","وقفہ"],["چھپی ہوئی معمولی غلطی","واضح / بڑی غلطی","اختیاری وقفہ","مد کی ایک قسم"],["قَالَ صحیح پڑھنا","قَلْب کو كَلْب پڑھنا","مِنْ صحیح پڑھنا","هُوَ صحیح پڑھنا"],["مخرج","صفت","حرکت","مد"],["لفظ مکمل طور پر بدل دیتا ہے","مخارج میں واضح غلطی ہوتی ہے","حسنِ ادائیگی کی صفات میں معمولی کمی یا زیادتی ہوتی ہے","ہمیشہ جان بوجھ کر ہوتی ہے"],["فرض","حرام","مکروہ","واجب"],["قَالَ کو قَالَ پڑھنا","قَالَ کو قَالَا پڑھنا","قَالَ کو كَالَ پڑھنا","قَالَ کو قُلْ پڑھنا"],["دونوں فرضِ عین ہیں","نظری قواعد فرضِ کفایہ ہیں؛ تجوید کے مطابق تلاوت فرضِ عین ہے","دونوں فرضِ کفایہ ہیں","تلاوت فرضِ کفایہ ہے؛ نظریہ فرضِ عین ہے"],["ایک صفت کی قسم","وہ مخصوص جگہ جہاں سے عربی حرف ادا ہوتا ہے","مد کی ایک قسم","قرآنی آیت"],["14","16","17","18"],["2 مخارج، 4 حروف","3 مخارج، 6 حروف","4 مخارج، 6 حروف","3 مخارج، 8 حروف"],["ء ، هـ","ع ، ح","غ ، خ","ق ، ك"],["ء ، هـ","ع ، ح","غ ، خ","ب ، م"],["ء ، هـ","ع ، ح","غ ، خ","ج ، ش"],["2 مخارج، 4 حروف","3 مخارج، 6 حروف","1 مخرج، 3 حروف","2 مخارج، 6 حروف"],["دونوں ہونٹ مکمل بند ہوتے ہیں","نچلے ہونٹ کا اندرونی کنارہ اوپر کے اگلے دانتوں سے لگتا ہے","زبان تالو سے لگتی ہے","ہونٹ گول ہوتے ہیں اور درمیان میں معمولی سا خلا رہتا ہے"],["دونوں میں ہونٹ بند ہوتے ہیں","دونوں حلق کے حروف ہیں","دونوں زبان سے ادا ہوتے ہیں","دونوں حروفِ مد ہیں"],["دونوں ہونٹ مضبوطی سے دبائے جاتے ہیں","زبان اوپر کے دانتوں سے لگتی ہے","ہونٹ گول ہوتے ہیں اور درمیان میں معمولی سا خلا رہتا ہے","نچلا ہونٹ اوپر کے دانتوں سے لگتا ہے"],["حروفِ حلقیہ","حروفِ شجریہ","حروفِ لہویہ","حروفِ شفتین"],["ك","ق","ش","ي"],["ج ، ش ، ي","ق ، ك","ف ، ب ، م ، و","ء ، هـ ، ع ، ح"],["تمام یاء جوف سے آتی ہے","یائے مد زبان کے وسط سے آتی ہے","متحرک/لین یاء وسط اللسان سے جبکہ یائے مد جوف سے آتی ہے","یاء ہمیشہ بھاری ہوتی ہے"],["صحیح","غلط"],["صحیح","غلط"]];
let lang='en',name='',idx=0,answers=Array(30).fill(null),left=900,timer;
const $=id=>document.getElementById(id);function setLang(l){lang=l;document.documentElement.lang=l==='ur'?'ur':'en';$('start').classList.toggle('rtl',l==='ur');document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));$('title').textContent=l==='ur'?'تجوید کوئز':'Tajweed Quiz';$('intro').textContent=l==='ur'?'30 سوالات · 15 منٹ':'30 questions · 15 minutes';$('nameLabel').textContent=l==='ur'?'طالب علم کا نام':'Student name';$('langLabel').textContent=l==='ur'?'زبان':'Language';$('name').placeholder=l==='ur'?'اپنا نام درج کریں':'Enter your name';$('startBtn').textContent=l==='ur'?'ٹیسٹ شروع کریں':'Start test'}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));function render(){const q=questions[idx], opts=lang==='ur'?optionUR[idx]:q[1];$('progressText').textContent=lang==='ur'?`سوال ${idx+1} از 30`:`Question ${idx+1} of 30`;$('bar').style.width=((idx+1)/30*100)+'%';$('prev').textContent=lang==='ur'?'پچھلا':'Previous';$('next').textContent=idx===29?(lang==='ur'?'جمع کریں':'Submit'):(lang==='ur'?'اگلا':'Next');const area=$('questionArea');area.className=lang==='ur'?'rtl':'';const text=lang==='ur'?ur[idx]:q[0];area.innerHTML=`<div class="qnum">${lang==='ur'?'سوال':'Question'} ${idx+1}</div><div class="qtext">${text}</div><div class="options">${opts.map((o,i)=>`<button type="button" class="option ${answers[idx]===i?'selected':''}" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span class="optiontext">${o}</span></button>`).join('')}</div>`;area.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[idx]=+b.dataset.i;render()});$('prev').disabled=idx===0}
function fmt(){return String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}function tick(){left--;$('timer').textContent=fmt();if(left<=60)$('timer').classList.add('warn');if(left<=0)submit()}function submit(){clearInterval(timer);let score=0;questions.forEach((q,i)=>{if(answers[i]===q[2])score++});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`${score} / 30`;$('resultMsg').textContent=lang==='ur'?`${name}، آپ کا ٹیسٹ جمع ہو گیا ہے۔`:`${name}, your test has been submitted.`;$('resultTitle').textContent=lang==='ur'?'ٹیسٹ جمع ہو گیا':'Test submitted'}$('startBtn').onclick=()=>{name=$('name').value.trim();if(!name){$('name').focus();return}idx=0;answers=Array(30).fill(null);left=900;$('timer').textContent='15:00';$('timer').classList.remove('warn');$('start').classList.add('hidden');$('quiz').classList.remove('hidden');render();clearInterval(timer);timer=setInterval(tick,1000)};$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('next').onclick=()=>{if(idx<29){idx++;render()}else submit()};setLang('en');
